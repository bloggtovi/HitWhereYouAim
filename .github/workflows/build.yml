name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned so the "Visual Studio 17 2022" generator used by CMakePresets.json is available
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Game-independent unit tests first: they take seconds and need no dependencies
      - name: Configure unit tests
        run: cmake -S tests -B build-tests

      - name: Build unit tests
        run: cmake --build build-tests --config Release

      - name: Run unit tests
        run: ctest --test-dir build-tests -C Release --output-on-failure -V

      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows-vcpkg

      - name: Build
        run: cmake --build --preset release

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: HitWhereYouAim
          path: build/package/Release/

      - name: Upload PDB
        uses: actions/upload-artifact@v4
        with:
          name: HitWhereYouAim-pdb
          path: build/Release/*.pdb
