name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned so the "Visual Studio 17 2022" generator used by CMakePresets.json is available
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows-vcpkg

      - name: Build
        run: cmake --build --preset release

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: HitWhereYouAim
          path: build/package/Release/

      - name: Upload PDB
        uses: actions/upload-artifact@v4
        with:
          name: HitWhereYouAim-pdb
          path: build/Release/*.pdb
