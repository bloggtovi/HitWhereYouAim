; Hit Where You Aim - default settings
; Copy overrides to Data/MCM/Settings/HitWhereYouAim.ini (MCM Helper writes there automatically).
; Values set in that file take precedence over the ones below.

[Main]
; Master switch
bEnabled = 1
; Compensate arrow drop / projectile gravity
bEnabledPitchCorrection = 1
; 0 = Automatic (ballistic solver), 1 = Fixed angle offset
iPitchCorrectionMode = 1
; Pitch offset in degrees used by the fixed angle mode
fPitchOffsetDegree = 0.7
; Clamp the aim distance to a likely target near the crosshair
bTargetDepthPrediction = 1
; Size of the target prediction window, in normalized screen units (0..1)
fPredictionWindowWidth = 0.5
fPredictionWindowHeight = 0.5
; Lead moving targets (automatic mode only)
bEnabledTargetLeading = 1
; Ignore leading corrections larger than this angle, in degrees
fMaxLeadingAngle = 45.0
; Add the player's horizontal velocity to launched projectiles
bInheritVelocity = 0

[Calibration]
; Maximum aim distance in meters
fMaximumTargetDistance = 100.0
; Extra pitch for bows and crossbows, in degrees
fArcheryPitchCalibration = 0.02
; Crosshair offset from the screen center (-1..1)
fCrosshairPosX = 0.0
fCrosshairPosY = 0.0
; Push the aim point this many meters past the surface hit by the crosshair ray
fRayPenetrationDepth = 0.2

[AngleCorrection]
; Third person bow pose adjustments
fPitchBias = 0.0
fHeightBias = 0.0
fBiasFadingStart = 45.0
; Degrees per second
fMaxPitchAdjustmentSpeed = 360.0
fMountedYawTolerance = 15.0

[TargetLock]
; Press the key to keep the screen center on the actor nearest the crosshair; press again to release
bTargetLockEnabled = 1
; SKSE key code: keyboard DirectX scan code (47 = V), mouse 256+ (258 = middle button), gamepad 266+
iTargetLockKey = 47
; Maximum lock distance in meters
fTargetLockMaxDistance = 60.0
; Search window around the crosshair, in normalized screen units (0..1)
fTargetLockWindowWidth = 0.6
fTargetLockWindowHeight = 0.6
; How fast the camera turns toward the target (higher = snappier)
fTargetLockRotationSpeed = 12.0
; Release the lock after the target stays out of sight this many seconds
fTargetLockLoseSightTime = 2.0
; Show "Target locked" / "released" messages
bTargetLockNotification = 1

[Debug]
bEnableLogging = 0
bShowTargetPredictionInfo = 0
; The following require TrueHUD
bShowCrosshairRayImpact = 0
bShowLastProjectilePath = 0
bEnabledTargetPrediction = 0
